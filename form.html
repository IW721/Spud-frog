<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spud & Frog — Order</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background:#f6f6f6; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background:#fff; border-radius: 14px; padding: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.07); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 12px; color:#444; }
    label { display:block; margin: 12px 0 6px; font-weight: 600; }
    input, select, textarea, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
    textarea { min-height: 90px; resize: vertical; }
    button { background:#111; color:#fff; border:none; font-weight: 700; cursor:pointer; margin-top: 14px; }
    button:active { transform: translateY(1px); }

    .row { display:flex; gap: 12px; }
    .row > div { flex: 1; }

    .day { border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-top: 12px; background:#fafafa; }
    .dayhead { display:flex; gap: 10px; align-items:center; }
    .dayhead h2 { font-size: 16px; margin: 0; flex:1; }

    .btnSecondary {
      background:#fff; color:#111; border: 1px solid #ddd; font-weight: 700;
      padding: 10px 12px; border-radius: 10px; cursor:pointer; width:auto;
    }

    .items { display:grid; gap: 10px; margin-top: 6px; }

    /* Item rows (keeps your simple vibe but supports customization) */
    .itemRow {
      background:#fff;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 10px;
    }
    .itemTop { display:flex; gap:10px; align-items:center; }
    .itemTop .name { flex: 1; font-weight: 650; }
    .qty { width: 110px; }

    .custom {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #e5e5e5;
      display:none;
    }
    .customTitle { font-weight: 700; font-size: 13px; margin-bottom: 6px; color:#333; }

    .muted { color:#666; font-size: 13px; margin-top: 6px; }
    .notice { font-size: 13px; color:#444; background:#fff; border:1px dashed #ddd; padding:10px; border-radius:10px; margin-top:10px; }

    .choices { display:flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .choice {
      display:flex; gap:8px; align-items:center;
      border:1px solid #ddd; background:#fff; padding: 8px 10px; border-radius: 999px;
      width: auto;
    }
    .choice input { width:auto; padding:0; border:none; }
    .choice span { font-weight: 600; font-size: 14px; }

    .tiny { font-size: 12px; color:#666; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Spud & Frog — Order</h1>
      <p>Pick a date → pick Breakfast/Lunch/Snacks → the menu updates → add quantities → customize if needed → send.</p>

      <form id="orderForm" action="https://formspree.io/f/xreqygke" method="POST">
        <input type="hidden" name="_subject" value="New Spud & Frog Order" />
        <input type="hidden" name="order_summary" id="order_summary" />

        <label>Your name</label>
        <input name="name" autocomplete="name" required />

        <label>Phone</label>
        <input name="phone" autocomplete="tel" inputmode="tel" required />

        <label>Email (for receipt)</label>
        <input name="customer_email" type="email" autocomplete="email" required />

        <label style="margin-top:14px;">Dietary</label>
        <div style="display:flex; gap:10px; align-items:center; padding:10px 0;">
          <input id="halal" name="halal" type="checkbox" value="Yes" style="width:auto; transform:scale(1.2);" />
          <label for="halal" style="margin:0; font-weight:600;">Halal</label>
        </div>

        <label>Order dates</label>
        <div id="daysContainer"></div>

        <button type="button" id="addDayBtn" class="btnSecondary" style="margin-top:12px;">
          + Add another date
        </button>

        <label>General notes (optional)</label>
        <textarea name="notes" placeholder="Allergies, no onions, etc."></textarea>

        <input type="text" name="_gotcha" style="display:none" />

        <button type="submit">Send Order</button>
        <div class="tiny">If you don’t get a confirmation, tell Cesar.</div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      // ✅ EDIT THESE MENUS
      // For customizable items, add: { name, customizable:true, custom:{ proteinRadio:[], addOns:[], remove:[] } }
 const MENUS = {
  "Breakfast": [
    {
      name: "Breakfast Sandwich",
      customizable: true,
      custom: {
        proteinRadio: ["Sausage", "Bacon", "Ham", "No meat"],
        addOns: ["Guac", "Avocado", "Extra cheese"],
        remove: ["No cheese", "No egg"]
      }
    }
  ],

  "Lunch": [
    { name: "Hamburger" },
    { name: "Beef Empanada" },
    { name: "Chicken Schnitzel" },
    { name: "Beef Stew" }
  ],

  "Snacks": [
    { name: "Monster Energy Drink" },
    { name: "Coke" },
    { name: "Water" },
    { name: "Protein Bar" }
  ]
};};

      const daysContainer = document.getElementById("daysContainer");
      const addDayBtn = document.getElementById("addDayBtn");
      const orderForm = document.getElementById("orderForm");
      const orderSummaryEl = document.getElementById("order_summary");

      let dayUidCounter = 0;

      function slug(s) {
        return (s || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "");
      }

      function chipHTML(type, nameAttr, value) {
        const id = `${nameAttr}_${slug(value)}`;
        return `
          <label class="choice" for="${id}">
            <input id="${id}" type="${type}" name="${nameAttr}" value="${value}">
            <span>${value}</span>
          </label>
        `;
      }

      function renderItems(itemsWrap, mealType, dayUid) {
        itemsWrap.innerHTML = "";

        if (!mealType) {
          itemsWrap.innerHTML = `<div class="notice">Pick a meal type to see the menu.</div>`;
          return;
        }

        const items = MENUS[mealType] || [];
        if (items.length === 0) {
          itemsWrap.innerHTML = `<div class="notice">No menu items set for ${mealType} yet.</div>`;
          return;
        }

        const list = document.createElement("div");
        list.className = "items";

        items.forEach((item) => {
          const itemKey = `${dayUid}_${slug(item.name)}`;

          const row = document.createElement("div");
          row.className = "itemRow";

          row.innerHTML = `
            <div class="itemTop">
              <div class="name">${item.name}</div>
              <input class="qty" type="number" min="0" value="0"
                data-item="${item.name.replaceAll('"','&quot;')}" />
            </div>

            ${
              item.customizable ? `
              <div class="custom" data-custom="1">
                <div class="customTitle">Customize</div>

                ${
                  (item.custom?.proteinRadio?.length || 0) ? `
                  <div class="muted">Protein</div>
                  <div class="choices">
                    ${item.custom.proteinRadio.map(v => chipHTML("radio", `${itemKey}_protein`, v)).join("")}
                  </div>
                  ` : ""
                }

                ${
                  (item.custom?.addOns?.length || 0) ? `
                  <div class="muted" style="margin-top:10px;">Add-ons</div>
                  <div class="choices">
                    ${item.custom.addOns.map(v => chipHTML("checkbox", `${itemKey}_addons`, v)).join("")}
                  </div>
                  ` : ""
                }

                ${
                  (item.custom?.remove?.length || 0) ? `
                  <div class="muted" style="margin-top:10px;">Remove</div>
                  <div class="choices">
                    ${item.custom.remove.map(v => chipHTML("checkbox", `${itemKey}_remove`, v)).join("")}
                  </div>
                  ` : ""
                }

                <div class="muted" style="margin-top:10px;">Item notes (optional)</div>
                <input type="text" class="itemNotes" placeholder="e.g., extra napkins, well done" />
              </div>
              ` : ""
            }
          `;

          // qty toggles custom area
          const qtyInput = row.querySelector(".qty");
          const customDiv = row.querySelector(".custom");

          function toggleCustom() {
            const n = parseInt(qtyInput.value || "0", 10);
            if (!customDiv) return;

            customDiv.style.display = (n > 0) ? "block" : "none";

            // If qty goes back to 0, clear customization inputs
            if (n <= 0) {
              customDiv.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(i => i.checked = false);
              const notes = customDiv.querySelector(".itemNotes");
              if (notes) notes.value = "";
            }
          }

          qtyInput.addEventListener("input", toggleCustom);
          qtyInput.addEventListener("change", toggleCustom);
          toggleCustom();

          list.appendChild(row);
        });

        itemsWrap.appendChild(list);
      }

      function dayBlockEl(dayUid) {
        const block = document.createElement("div");
        block.className = "day";
        block.dataset.uid = dayUid;

        block.innerHTML = `
          <div class="dayhead">
            <h2>Order for a date</h2>
            <button type="button" class="btnSecondary removeDayBtn">Remove</button>
          </div>

          <div class="row">
            <div>
              <label>Date</label>
              <input type="date" class="dateInput" required />
              <div class="muted">Choose the date first, then pick meal type.</div>
            </div>

            <div>
              <label>Meal type</label>
              <select class="mealSelect" required disabled>
                <option value="">Choose…</option>
                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Snacks</option>
              </select>
            </div>
          </div>

          <label>Items</label>
          <div class="itemsWrap"></div>
        `;
        return block;
      }

      function ensureRemoveButtons() {
        const blocks = [...daysContainer.querySelectorAll(".day")];
        blocks.forEach(b => {
          const btn = b.querySelector(".removeDayBtn");
          btn.style.display = (blocks.length <= 1) ? "none" : "inline-block";
        });
      }

      function wireBlock(block) {
        const dateInput = block.querySelector(".dateInput");
        const mealSelect = block.querySelector(".mealSelect");
        const removeBtn = block.querySelector(".removeDayBtn");
        const itemsWrap = block.querySelector(".itemsWrap");
        const dayUid = block.dataset.uid;

        // default state
        itemsWrap.innerHTML = `<div class="notice">Pick a meal type to see the menu.</div>`;

        dateInput.addEventListener("change", () => {
          if (dateInput.value) {
            mealSelect.disabled = false;
          } else {
            mealSelect.value = "";
            mealSelect.disabled = true;
            itemsWrap.innerHTML = `<div class="notice">Pick a meal type to see the menu.</div>`;
          }
        });

        mealSelect.addEventListener("change", () => {
          renderItems(itemsWrap, mealSelect.value, dayUid);
        });

        removeBtn.addEventListener("click", () => {
          block.remove();
          ensureRemoveButtons();
        });
      }

      function addDayBlock() {
        const dayUid = `d${++dayUidCounter}`;
        const block = dayBlockEl(dayUid);
        daysContainer.appendChild(block);
        wireBlock(block);
        ensureRemoveButtons();
      }

      function getCheckedValues(root, selector) {
        return [...root.querySelectorAll(selector)]
          .filter(i => i.checked)
          .map(i => i.value);
      }

      function buildOrderSummary() {
        const dayBlocks = [...daysContainer.querySelectorAll(".day")];
        let lines = [];

        const halal = document.getElementById("halal").checked ? "Yes" : "No";
        lines.push(`Halal: ${halal}`);
        lines.push("");

        let totalItems = 0;

        for (const [i, d] of dayBlocks.entries()) {
          const dateVal = d.querySelector(".dateInput").value;
          const mealVal = d.querySelector(".mealSelect").value;

          if (!dateVal) return { ok:false, message: "One of the date fields is blank." };
          if (!mealVal) return { ok:false, message: `Meal type missing for ${dateVal || "a date"}.` };

          lines.push(`Day ${i+1}: ${dateVal} (${mealVal})`);

          const itemRows = [...d.querySelectorAll(".itemRow")];
          let anyInDay = false;

          itemRows.forEach((row) => {
            const qtyInput = row.querySelector(".qty");
            const qty = parseInt(qtyInput.value || "0", 10);
            if (qty <= 0) return;

            anyInDay = true;
            totalItems += qty;

            const itemName = qtyInput.dataset.item;
            lines.push(`- ${itemName}: ${qty}`);

            const customDiv = row.querySelector(".custom");
            if (customDiv && customDiv.style.display !== "none") {
              // Protein: checked radio within this custom block
              const protein = getCheckedValues(customDiv, 'input[type="radio"]').join(", ");

              // Add-ons / Remove: checked checkboxes within this custom block
              const addons = getCheckedValues(customDiv, 'div:nth-of-type(1) input[type="checkbox"]'); // safe-ish but we do better below

              // Better: just grab ALL checked checkboxes, then split by name suffix
              const allChecked = [...customDiv.querySelectorAll('input[type="checkbox"]')].filter(x => x.checked);
              const addOnsList = allChecked.filter(x => (x.name || "").endsWith("_addons")).map(x => x.value);
              const removeList = allChecked.filter(x => (x.name || "").endsWith("_remove")).map(x => x.value);

              const notesEl = customDiv.querySelector(".itemNotes");
              const notes = notesEl && notesEl.value.trim() ? notesEl.value.trim() : "";

              if (protein) lines.push(`  • Protein: ${protein}`);
              if (addOnsList.length) lines.push(`  • Add-ons: ${addOnsList.join(", ")}`);
              if (removeList.length) lines.push(`  • Remove: ${removeList.join(", ")}`);
              if (notes) lines.push(`  • Notes: ${notes}`);
            }
          });

          if (!anyInDay) lines.push("- (no items selected)");
          lines.push("");
        }

        if (totalItems <= 0) return { ok:false, message: "Add at least 1 item before sending." };

        return { ok:true, summary: lines.join("\n").trim() };
      }

      addDayBtn.addEventListener("click", addDayBlock);

      orderForm.addEventListener("submit", (e) => {
        const res = buildOrderSummary();
        if (!res.ok) {
          e.preventDefault();
          alert(res.message);
          return;
        }
        orderSummaryEl.value = res.summary;
      });

      // start with one
      addDayBlock();
    });
  </script>
</body>
</html>
